name: CI

on:
  push:
    branches:
      - "**"
  pull_request:
  workflow_call:

permissions:
  contents: read

jobs:
  repository:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Check whitespace
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          if ! git cat-file -e "${BASE_SHA}^{commit}" 2>/dev/null; then
            BASE_SHA=$(git rev-list --max-parents=0 HEAD)
          fi
          git diff --check "${BASE_SHA}...HEAD"
      - name: Check deployment scripts
        run: bash -n deploy/scripts/*.sh
      - name: Check shared-test Compose
        run: >-
          docker compose --env-file deploy/shared-test.env.example
          -f deploy/compose.shared-test.yaml config --no-interpolate --quiet
      - name: Check production Compose
        run: >-
          docker compose --env-file deploy/production.env.example
          -f deploy/compose.production.yaml config --no-interpolate --quiet

  server:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: ci-root-only
          MYSQL_DATABASE: order_tracking_test
          MYSQL_USER: order_test
          MYSQL_PASSWORD: ci-test-only
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -pci-root-only --silent"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=30
    env:
      ORDER_TRACKING_APP_ENV: test
      ORDER_TRACKING_DATABASE_URL: mysql+pymysql://order_test:ci-test-only@127.0.0.1:3306/order_tracking_test?charset=utf8mb4
      ORDER_TRACKING_TEST_DATABASE_URL: mysql+pymysql://order_test:ci-test-only@127.0.0.1:3306/order_tracking_test?charset=utf8mb4
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install uv
        run: python -m pip install uv==0.12.3
      - name: Install locked dependencies
        run: uv sync --locked
      - name: Upgrade empty MySQL database
        run: uv run alembic upgrade head
      - name: Check migration model drift
        run: uv run alembic check
      - name: Lint
        run: uv run ruff check .
      - name: Type check
        run: uv run mypy app
      - name: Test
        run: uv run pytest
      - name: Check exported OpenAPI
        run: uv run python -m scripts.export_openapi --check

  admin-web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: admin-web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Enable pnpm
        run: corepack enable && corepack prepare pnpm@11.22.0 --activate
      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile
      - name: Check generated API types
        run: pnpm generate:api && git -C .. diff --exit-code -- admin-web/src/api/generated.ts
      - name: Lint
        run: pnpm lint
      - name: Type check
        run: pnpm typecheck
      - name: Test
        run: pnpm test --run
      - name: Build
        run: pnpm build

  miniprogram:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: miniprogram
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Enable pnpm
        run: corepack enable && corepack prepare pnpm@11.22.0 --activate
      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile
      - name: Check generated API types
        run: pnpm generate:api && git -C .. diff --exit-code -- miniprogram/api/generated.ts
      - name: Lint
        run: pnpm lint
      - name: Type check
        run: pnpm typecheck
      - name: Test
        run: pnpm test --run
      - name: Build check
        run: pnpm build

  containers:
    runs-on: ubuntu-latest
    needs: [server, admin-web]
    steps:
      - uses: actions/checkout@v4
      - name: Build server image
        run: docker build --tag order-tracking-server:ci server
      - name: Build admin web image
        run: docker build --tag order-tracking-admin-web:ci admin-web
