name: order-tracking-local

services:
  mysql-dev:
    image: mysql:8.0
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_DEV_ROOT_PASSWORD:?set MYSQL_DEV_ROOT_PASSWORD in .env}
      MYSQL_DATABASE: ${MYSQL_DEV_DATABASE:?set MYSQL_DEV_DATABASE in .env}
      MYSQL_USER: ${MYSQL_DEV_USER:?set MYSQL_DEV_USER in .env}
      MYSQL_PASSWORD: ${MYSQL_DEV_PASSWORD:?set MYSQL_DEV_PASSWORD in .env}
      TZ: Asia/Shanghai
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_0900_ai_ci
    ports:
      - "127.0.0.1:${MYSQL_DEV_PORT:-3307}:3306"
    volumes:
      - mysql-dev-data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 3s
      timeout: 3s
      retries: 30
      start_period: 20s

  mysql-test:
    image: mysql:8.0
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_TEST_ROOT_PASSWORD:?set MYSQL_TEST_ROOT_PASSWORD in .env}
      MYSQL_DATABASE: ${MYSQL_TEST_DATABASE:?set MYSQL_TEST_DATABASE in .env}
      MYSQL_USER: ${MYSQL_TEST_USER:?set MYSQL_TEST_USER in .env}
      MYSQL_PASSWORD: ${MYSQL_TEST_PASSWORD:?set MYSQL_TEST_PASSWORD in .env}
      TZ: Asia/Shanghai
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_0900_ai_ci
    ports:
      - "127.0.0.1:${MYSQL_TEST_PORT:-3308}:3306"
    volumes:
      - mysql-test-data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 3s
      timeout: 3s
      retries: 30
      start_period: 20s

volumes:
  mysql-dev-data:
  mysql-test-data:
