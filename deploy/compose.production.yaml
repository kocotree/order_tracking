name: order-tracking-production

x-server: &server
  image: order-tracking-server:${ORDER_TRACKING_DEPLOY_VERSION:?set ORDER_TRACKING_DEPLOY_VERSION}
  build:
    context: ../server
  env_file:
    - .env.production
  networks:
    - app
  restart: unless-stopped
  logging:
    driver: json-file
    options:
      max-size: 10m
      max-file: "5"

services:
  migrate:
    <<: *server
    profiles: [operations]
    command: ["uv", "run", "--no-sync", "alembic", "upgrade", "head"]
    restart: "no"

  api:
    <<: *server
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - >-
          import urllib.request;
          urllib.request.urlopen('http://127.0.0.1:8000/health/ready', timeout=3).read()
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 20s

  worker:
    <<: *server
    command: ["uv", "run", "--no-sync", "python", "-m", "app.worker"]
    volumes:
      - jst-token:/var/lib/order-tracking/jst

  admin-web:
    image: order-tracking-admin-web:${ORDER_TRACKING_DEPLOY_VERSION:?set ORDER_TRACKING_DEPLOY_VERSION}
    build:
      context: ../admin-web
    depends_on:
      api:
        condition: service_healthy
    networks:
      - app
      - traefik
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "5"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1/healthz"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 10s
    labels:
      traefik.enable: "true"
      traefik.docker.network: traefik-network
      traefik.http.routers.order-tracking-prod-web.rule: Host(`${ORDER_TRACKING_HOST:?set ORDER_TRACKING_HOST}`)
      traefik.http.routers.order-tracking-prod-web.entrypoints: websecure
      traefik.http.routers.order-tracking-prod-web.tls: "true"
      traefik.http.routers.order-tracking-prod-web.tls.certresolver: ${TRAEFIK_CERT_RESOLVER:-myresolver}
      traefik.http.services.order-tracking-prod-web.loadbalancer.server.port: "80"

networks:
  app:
    name: order-tracking-production-internal
  traefik:
    external: true
    name: traefik-network

volumes:
  jst-token:
