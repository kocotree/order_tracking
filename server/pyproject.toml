[project]
name = "order-tracking-server"
version = "0.1.0"
description = "Order tracking API and background worker"
requires-python = ">=3.13,<3.14"
dependencies = [
  "alembic>=1.16,<2",
  "cryptography>=46,<47",
  "fastapi>=0.116,<1",
  "pydantic-settings>=2.10,<3",
  "pymysql>=1.1,<2",
  "python-multipart>=0.0.20,<1",
  "sqlalchemy>=2.0,<3",
  "uvicorn[standard]>=0.35,<1",
]

[dependency-groups]
dev = [
  "httpx>=0.28,<1",
  "mypy>=1.17,<2",
  "pytest>=8.4,<9",
  "pytest-cov>=6.2,<7",
  "ruff>=0.12,<1",
]

[tool.pytest.ini_options]
addopts = "-ra"
filterwarnings = [
  "ignore:Using .*starlette.testclient.* is deprecated.*",
]
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.13"
strict = true
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["pymysql.*"]
ignore_missing_imports = true
